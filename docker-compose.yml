services:
  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    ports:
      - "8080:8000"
    volumes:
      # Live-mount the package source so edits on the host are picked up
      # without rebuilding the image.
      - ./src:/package/src
      - ./config:/package/config
      - ./harness/routes/discord.php:/app/routes/discord.php
      - ./harness/config/cors.php:/app/config/cors.php
      - ./harness/.env:/app/.env

  swagger-ui:
    image: swaggerapi/swagger-ui
    ports:
      - "8081:8080"
    environment:
      - SWAGGER_JSON=/openapi.yaml
    volumes:
      - ./docs/openapi.yaml:/openapi.yaml:ro
