openapi: 3.0.3
info:
  title: Reysa Discord API (Laravel package) v2 - Test Harness
  description: >-
    Reference for every DAPI:: method in the reysa/discord-api Laravel package (v2:
    full coverage of Discord's documented bot REST API). Each entry's summary/description
    shows the real PHP call you write in your own app (e.g. DAPI::getGuildInvites($guildId))
    -- that PHP call is the package's actual interface. The HTTP route shown below each one
    only exists in this local docker-compose test harness, as a thin proxy so you can click
    "Try it out" and fire a real request without writing PHP; it is not part of the
    published package and a real consumer of this package never sees or calls it.
  version: "2.0.0"
servers:
  - url: http://localhost:8080
    description: Local docker-compose harness
tags:
  - name: 'Core (v1)'
    description: 'The original hand-written convenience helpers (guild invites, roles, DMs, channel messages) -- kept for backward compatibility.'
  - name: 'Guilds'
    description: 'Guild (server) settings, members, roles, bans, prune, widgets, onboarding, and welcome screens.'
    externalDocs:
      description: Official Discord API docs for this resource
      url: https://discord.com/developers/docs/resources/guild
  - name: 'Channels'
    description: 'Channel CRUD, permission overwrites, threads, typing indicator, pins, and channel-scoped invites.'
    externalDocs:
      description: Official Discord API docs for this resource
      url: https://discord.com/developers/docs/resources/channel
  - name: 'Messages'
    description: 'Sending, editing, deleting, reacting to, and bulk-managing messages in a channel.'
    externalDocs:
      description: Official Discord API docs for this resource
      url: https://discord.com/developers/docs/resources/message
  - name: 'Users'
    description: 'The current bot user and other users'' public profile/connection data.'
    externalDocs:
      description: Official Discord API docs for this resource
      url: https://discord.com/developers/docs/resources/user
  - name: 'Webhooks'
    description: 'Creating and executing channel webhooks, including Slack/GitHub-compatible payloads.'
    externalDocs:
      description: Official Discord API docs for this resource
      url: https://discord.com/developers/docs/resources/webhook
  - name: 'Emojis'
    description: 'Custom guild and application emoji management.'
    externalDocs:
      description: Official Discord API docs for this resource
      url: https://discord.com/developers/docs/resources/emoji
  - name: 'Stickers'
    description: 'Guild stickers and the public sticker pack catalog.'
    externalDocs:
      description: Official Discord API docs for this resource
      url: https://discord.com/developers/docs/resources/sticker
  - name: 'Invites'
    description: 'Looking up and deleting invite codes.'
    externalDocs:
      description: Official Discord API docs for this resource
      url: https://discord.com/developers/docs/resources/invite
  - name: 'GuildTemplates'
    description: 'Creating new guilds from, and managing, guild templates.'
    externalDocs:
      description: Official Discord API docs for this resource
      url: https://discord.com/developers/docs/resources/guild-template
  - name: 'ScheduledEvents'
    description: 'Guild scheduled events (creation, updates, and the RSVP user list).'
    externalDocs:
      description: Official Discord API docs for this resource
      url: https://discord.com/developers/docs/resources/guild-scheduled-event
  - name: 'StageInstances'
    description: 'Live Stage channel instances (topic, privacy level).'
    externalDocs:
      description: Official Discord API docs for this resource
      url: https://discord.com/developers/docs/resources/stage-instance
  - name: 'Soundboard'
    description: 'Guild soundboard sounds and playing the default soundboard.'
    externalDocs:
      description: Official Discord API docs for this resource
      url: https://discord.com/developers/docs/resources/soundboard
  - name: 'Polls'
    description: 'Reading poll answer voters and ending a poll early.'
    externalDocs:
      description: Official Discord API docs for this resource
      url: https://discord.com/developers/docs/resources/poll
  - name: 'Voice'
    description: 'Voice regions and voice state for guild members.'
    externalDocs:
      description: Official Discord API docs for this resource
      url: https://discord.com/developers/docs/resources/voice
  - name: 'ApplicationCommands'
    description: 'Registering, updating, and permissioning global/guild slash commands.'
    externalDocs:
      description: Official Discord API docs for this resource
      url: https://discord.com/developers/docs/interactions/application-commands
  - name: 'Interactions'
    description: 'Responding to and following up on a received interaction (slash command, component, modal).'
    externalDocs:
      description: Official Discord API docs for this resource
      url: https://discord.com/developers/docs/interactions/receiving-and-responding
  - name: 'AuditLog'
    description: 'Reading a guild''s audit log.'
    externalDocs:
      description: Official Discord API docs for this resource
      url: https://discord.com/developers/docs/resources/audit-log
  - name: 'AutoModeration'
    description: 'Auto Moderation rules for a guild.'
    externalDocs:
      description: Official Discord API docs for this resource
      url: https://discord.com/developers/docs/resources/auto-moderation
  - name: 'Monetization'
    description: 'SKUs, entitlements, and subscriptions for monetized apps.'
    externalDocs:
      description: Official Discord API docs for this resource
      url: https://discord.com/developers/docs/resources/sku
  - name: 'OAuth2'
    description: 'The OAuth2 authorization-code flow (not bot-token calls) -- exchanging codes, refreshing/revoking tokens, and reading the current authorization/application.'
    externalDocs:
      description: Official Discord API docs for this resource
      url: https://discord.com/developers/docs/topics/oauth2
  - name: 'Applications'
    description: 'The bot''s own application record and activity instances.'
    externalDocs:
      description: Official Discord API docs for this resource
      url: https://discord.com/developers/docs/resources/application
paths:
  /discord/guilds/{guildId}/invites:
    get:
      summary: 'DAPI::getGuildInvites($guildId)'
      tags: ['Core (v1)']
      operationId: getGuildInvites
      description: |-
        PHP usage (this is the package's real interface):

            DAPI::getGuildInvites($guildId)

        Fetch all invites for the configured guild.

        The HTTP route below is a local test-harness proxy only -- see CLAUDE.md section 4.
      parameters:
        - name: guildId
          in: path
          required: true
          description: 'Guild (server) snowflake ID.'
          schema:
            type: string
      responses:
        '200':
          description: Discord API response (proxied as JSON).
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Discord rejected the bot token (missing/invalid DISCORD_BOT_TOKEN in harness/.env).
  /discord/invites/{code}:
    delete:
      summary: 'DAPI::deleteGuildInvite($code)'
      tags: ['Core (v1)']
      operationId: deleteGuildInvite
      description: |-
        PHP usage (this is the package's real interface):

            DAPI::deleteGuildInvite($code)

        Delete a specific invite by code.

        The HTTP route below is a local test-harness proxy only -- see CLAUDE.md section 4.
      parameters:
        - name: code
          in: path
          required: true
          description: 'Invite code (the part after discord.gg/).'
          schema:
            type: string
      responses:
        '200':
          description: Discord API response (proxied as JSON).
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Discord rejected the bot token (missing/invalid DISCORD_BOT_TOKEN in harness/.env).
