        The HTTP route below is a local test-harness proxy only -- see CLAUDE.md section 4.
      parameters:
        - name: userId
          in: path
          required: true
          description: 'User snowflake ID.'
          schema:
            type: string
      responses:
        '200':
          description: Discord API response (proxied as JSON).
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Discord rejected the bot token (missing/invalid DISCORD_BOT_TOKEN in harness/.env).
    put:
      summary: 'DAPI::addGuildMember($guildId, $userId, array $data = [])'
      tags: ['Guilds']
      operationId: addGuildMember
      description: |-
        PHP usage (this is the package's real interface):

            DAPI::addGuildMember($guildId, $userId, array $data = [])

        Adds a user to the guild, provided you have a valid oauth2 access token for the user with the guilds.join scope. Returns a 201 Created with the guild member as the body, or 204 No Content if the user is already a member of the guild. Fires a Guild Member Add Gateway event.

        The HTTP route below is a local test-harness proxy only -- see CLAUDE.md section 4.
      parameters:
        - name: guildId
          in: path
          required: true
          description: 'Guild (server) snowflake ID.'
          schema:
            type: string
        - name: userId
          in: path
          required: true
          description: 'User snowflake ID.'
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: Passed through as-is to Discord (no validation applied by the package). See the tag's official-docs link for the exact field list.
      responses:
        '200':
          description: Discord API response (proxied as JSON).
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Discord rejected the bot token (missing/invalid DISCORD_BOT_TOKEN in harness/.env).
    patch:
      summary: 'DAPI::modifyGuildMember($guildId, $userId, array $data = [])'
      tags: ['Guilds']
      operationId: modifyGuildMember
      description: |-
        PHP usage (this is the package's real interface):

            DAPI::modifyGuildMember($guildId, $userId, array $data = [])

        Modify attributes of a guild member. Returns a 200 OK with the guild member as the body. Fires a Guild Member Update Gateway event. If the channel_id is set to null, this will force the target user to be disconnected from voice.

        The HTTP route below is a local test-harness proxy only -- see CLAUDE.md section 4.
      parameters:
        - name: guildId
          in: path
          required: true
          description: 'Guild (server) snowflake ID.'
          schema:
            type: string
        - name: userId
          in: path
          required: true
          description: 'User snowflake ID.'
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: Passed through as-is to Discord (no validation applied by the package). See the tag's official-docs link for the exact field list.
      responses:
        '200':
          description: Discord API response (proxied as JSON).
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Discord rejected the bot token (missing/invalid DISCORD_BOT_TOKEN in harness/.env).
    delete:
      summary: 'DAPI::removeGuildMember($guildId, $userId)'
      tags: ['Guilds']
      operationId: removeGuildMember
      description: |-
        PHP usage (this is the package's real interface):

            DAPI::removeGuildMember($guildId, $userId)

        Remove a member from a guild. Requires KICK_MEMBERS permission. Returns a 204 empty response on success. Fires a Guild Member Remove Gateway event.

        The HTTP route below is a local test-harness proxy only -- see CLAUDE.md section 4.
      parameters:
        - name: guildId
          in: path
          required: true
          description: 'Guild (server) snowflake ID.'
          schema:
            type: string
        - name: userId
          in: path
          required: true
          description: 'User snowflake ID.'
          schema:
            type: string
      responses:
        '200':
          description: Discord API response (proxied as JSON).
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Discord rejected the bot token (missing/invalid DISCORD_BOT_TOKEN in harness/.env).
