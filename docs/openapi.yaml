          content:
            application/json:
              schema:
                type: object
        '401':
          description: Discord rejected the bot token (missing/invalid DISCORD_BOT_TOKEN in harness/.env).
    patch:
      summary: 'DAPI::modifyGuildRolePositions($guildId, array $data = [])'
      tags: ['Guilds']
      operationId: modifyGuildRolePositions
      description: |-
        PHP usage (this is the package's real interface):

            DAPI::modifyGuildRolePositions($guildId, array $data = [])

        Modify the positions of a set of role objects for the guild. Requires the MANAGE_ROLES permission. Returns a list of all of the guild's role objects on success. Fires multiple Guild Role Update Gateway events.

        The HTTP route below is a local test-harness proxy only -- see CLAUDE.md section 4.
      parameters:
