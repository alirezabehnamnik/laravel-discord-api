          content:
            application/json:
              schema:
                type: object
        '401':
          description: Discord rejected the bot token (missing/invalid DISCORD_BOT_TOKEN in harness/.env).
  /discord/guilds/{guildId}/members/{userId}/roles:
    put:
      summary: 'DAPI::giveRole($userId, array $roleIds)'
      tags: ['Core (v1)']
      operationId: giveRole
      description: |-
        PHP usage (this is the package's real interface):

            DAPI::giveRole($userId, array $roleIds)

        Give one or more roles to a member (one Discord API call per role ID).

